<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRIME DOCS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PRIME DOCS">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- D184: бланк печатается ЭТИМ документом → шрифты бренда нужны здесь. (Приложение шлёт и свой @import,
     но он приходит внутри склейки стилей и может оказаться не первым правилом — на @import это фатально.) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html,body{margin:0;height:100%;background:#e9e7e0;overflow:hidden}
  /* ПЕЧАТЬ: бумага A4. @page внутри приложения НЕ работает — оно в iframe, а при печати действует @page
     ВЕРХНЕГО документа (этой обёртки). Без этого браузер печатал Letter (612×792) вместо A4 → «не тот вид».
     Поля НЕ задаём: у бланка сметы и бланка документа они разные, каждый держит свои отступы сам. */
  @page{size:A4 portrait;margin:12mm}
  /* Фон обёртки (#e9e7e0) при печати заливал бы всю страницу серым — верхний документ печатается тоже. */
  @media print{ html,body{background:#fff!important} }
  :root{--barh:34px}
  .pdapp{position:fixed;inset:0;width:100%;height:100%;border:0}
  /* Заставка держится, пока приложение не ОТРИСУЕТ данные (сигнал pdpainted), и гаснет плавно.
     Раньше снималась по load рамки — то есть до загрузки журнала, и владелец видел «мелькание»:
     голый экран приложения (пустая шапка + «Загрузка журнала…») между заставкой и списком. */
  #ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
      font-family:system-ui,-apple-system,sans-serif;color:#6E7480;background:#e9e7e0;font-size:15px;
      opacity:1;transition:opacity .32s ease}
  #ld.gone{opacity:0;pointer-events:none}
  .pdapp{opacity:0;transition:opacity .32s ease}
  body.pdshown .pdapp{opacity:1}
  /* MULTI: панель открытых экранов — видна ТОЛЬКО когда открыто 2+ экрана (при одном всё как раньше) */
  .pdbar{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:center;gap:4px;box-sizing:border-box;
       padding:0 4px;padding-top:env(safe-area-inset-top);height:calc(var(--barh) + env(safe-area-inset-top));
       background:#1B2A4E;color:#fff;font:600 12px system-ui,-apple-system,sans-serif}
  body.multi .pdbar{display:flex}
  body.multi .pdapp{top:calc(var(--barh) + env(safe-area-inset-top));height:calc(100% - var(--barh) - env(safe-area-inset-top))}
  body.printing .pdbar{display:none}
  .pdbar .pdnav{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;
            cursor:pointer;font-size:18px;line-height:1;opacity:.9;user-select:none}
  .pdbar .pdnav:active{background:rgba(255,255,255,.18)}
  .pdbar .pdnav.off{opacity:.28}
  .pdbar .pdtabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .pdbar .pdtabs::-webkit-scrollbar{display:none}
  .pdbar .pdtab{flex:none;display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;cursor:pointer;
            white-space:nowrap;background:rgba(255,255,255,.14)}
  .pdbar .pdtab.on{background:#C9A961;color:#1B2A4E}
  .pdbar .pdtab i{font-style:normal;opacity:.7;font-size:12px;padding:0 2px}
  .pdbar .pdtab i:active{opacity:1}
  @media print{.pdbar{display:none!important}}
  /* D184: бланк печатаем ЗДЕСЬ, в верхнем документе (см. скрипт ниже). На экране он не виден никогда —
     показывается только на время печати. Стили бланка приходят из приложения и вставляются ПЕРЕД этим
     блоком, поэтому правила ниже перебивают их (порядок + !important). */
  #pdpaper{display:none}
  body.papering #pdpaper{display:block;background:#fff}
  body.papering #stage,body.papering .pdbar{display:none!important}
  /* у обёртки html,body — overflow:hidden + height:100% (это «оболочка» экрана). Для бумаги их надо
     распустить, иначе многостраничный бланк обрежется на первой странице. */
  html.papering,body.papering{overflow:visible!important;height:auto!important;background:#fff!important}
  @media print{ body.papering #pdpaper{display:block!important} }
</style></head>
<body>
<div id="ld">Загрузка PRIME DOCS…</div>
<div class="pdbar" id="bar"><span class="pdnav" id="prev">‹</span><span class="pdtabs" id="tabs"></span><span class="pdnav" id="next">›</span></div>
<div id="stage"></div>
<div id="pdpaper"></div>
<script>
/* ОФЛАЙН-РЕДИРЕКТ (аддитивно): нет сети при загрузке → уводим на офлайн-доску и НЕ поднимаем онлайн-журнал
   (см. охранник у route('') внизу). Онлайн (PD_OFFLINE=false) — весь путь ниже как раньше, байт-в-байт.
   SW заранее закэшировал offline.html, так что она открывается без сети (после первого онлайн-визита). */
function pdGoOffline(){ try{ location.replace('offline.html'); }catch(e){ try{ location.href='offline.html'; }catch(_){} } }
var _pdRouted=false;
/* R16: при плохой/нет связи НЕ уводим МОЛЧА на офлайн-доску — спрашиваем выбор (владелец видит, что связь есть, просто медленная). */
function pdOfflinePrompt(){
  if(document.getElementById('pdOffAsk')) return;   // не дублировать
  var d=document.createElement('div'); d.id='pdOffAsk';
  d.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(18,24,38,.90);display:flex;align-items:center;justify-content:center;padding:22px;font-family:Archivo,system-ui,sans-serif';
  d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:340px;width:100%;padding:24px 20px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)">'
    +'<div style="font-size:40px;line-height:1">📶</div>'
    +'<div style="font-size:17px;font-weight:800;color:#1B2A4E;margin:10px 0 6px">Связь плохая или отсутствует</div>'
    +'<div style="font-size:13.5px;color:#5B6472;line-height:1.5;margin-bottom:18px">Не удалось быстро подтвердить интернет. Что открыть?</div>'
    +'<button id="pdOffApp" style="display:block;width:100%;padding:13px;border-radius:10px;border:1px solid #B9922F;background:#C9A961;color:#3a2f12;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px">Открыть приложение</button>'
    +'<button id="pdOffNotes" style="display:block;width:100%;padding:13px;border-radius:10px;border:1px solid #C3CEE6;background:#fff;color:#1B2A4E;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer">Стартовый экран (заметки офлайн)</button>'
  +'</div>';
  document.body.appendChild(d);
  var rm=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
  document.getElementById('pdOffApp').onclick=function(){ PD_OFFLINE=false; rm(); if(!_pdRouted){ _pdRouted=true; try{ route(''); }catch(e){} } };   // связь есть — открываем приложение (если ещё не поднято)
  document.getElementById('pdOffNotes').onclick=function(){ rm(); pdGoOffline(); };   // офлайн-доска заметок
}
/* R16: АВТО-ОФЛАЙН УБРАН ПОЛНОСТЬЮ. navigator.onLine врёт (в авиарежиме = true; на медленной связи проба таймаутила = ЛОЖНЫЙ
   офлайн), из-за чего приложение само уводило на офлайн-доску при живой связи. По решению владельца: приложение ВСЕГДА грузится
   ОНЛАЙН; офлайн-доску владелец открывает ТОЛЬКО ВРУЧНУЮ — кнопка «📴 Офлайн» внизу слева (pdGoOffline). pdOfflinePrompt/проба не вызываются. */
var PD_OFFLINE = false;
/* R16 зам.: офлайн ОТКЛЮЧЁН по решению владельца — кнопка «📴 Офлайн» убрана, точки входа в офлайн нет. */
/* A9 ТЁПЛЫЙ ШЕЛЛ: 3 iframe (journal/estimate/assemble), переключаем видимый + шлём целевому pdgo вместо
   перезагрузки. Ключевое: pdgo шлём на сохранённое из pdready окно app (e.source), НЕ на frame.contentWindow
   (2-уровневый GAS-iframe: contentWindow=sandbox, до кода app не доходит — проверено на форке).
   Все 3 экрана — WARM (у каждого приёмник pdgo). Не-WARM экран (если появится) грузился бы перезагрузкой. */
var EXEC = "https://script.google.com/macros/s/AKfycbzRhx3sp9dnPTvmUTmRmsnBgRzQxJBo98T6jNN59a0AJFpSGiMwvSsfwy8B1oe2a1G--g/exec";
var stage = document.getElementById('stage');
var WARM = { journal:1, assemble:1, estimate:1, checklist:1 };   // все экраны тёплые (у каждого приёмник pdgo). D185: +checklist
var SCREENS = { journal:null, estimate:null, assemble:null, checklist:null };   // D185: +checklist
/* D179 ЗАМОК: приложение закрыто кодом. Пропуск выдаёт сервер после ввода кода; ОБЁРТКА его помнит
   (localStorage этого сайта) и подставляет к КАЖДОМУ адресу /exec — экраны и печать. Нет пропуска →
   приложение само покажет окно ввода кода и пришлёт {pdtoken} наверх (см. обработчик сообщений).
   Замок выключен → пропуска нет → withTok ничего не меняет, всё работает как раньше. */
var PD_TOKEN = ''; try{ PD_TOKEN = localStorage.getItem('pd_token') || ''; }catch(e){}
function withTok(qs){ qs=qs||''; if(!PD_TOKEN) return qs; if(/[?&]t=/.test(qs)) return qs; return qs + (qs.indexOf('?')===0?'&':'?') + 't=' + encodeURIComponent(PD_TOKEN); }
function screenOf(qs){ qs=qs||''; if(/[?&]estimate=1/.test(qs))return 'estimate'; if(/[?&]assemble=1/.test(qs))return 'assemble'; if(/[?&]checklist=1/.test(qs))return 'checklist'; return 'journal'; }   // D185
function bootUrl(screen, qs){ if(screen==='journal') return EXEC + withTok(/[?&]openProj=/.test(qs||'')?qs:''); return EXEC + withTok(qs); }
/* Снятие заставки — ОДНА точка на все пути (pdpainted, страховочный таймер, ошибка).
   Идемпотентно: второй вызов ничего не делает, иначе повторный load дёргал бы анимацию заново. */
var _splashGone=false;
function hideSplash(){
  if(_splashGone) return; _splashGone=true;
  var _oa=document.getElementById('pdOffAsk'); if(_oa&&_oa.parentNode)_oa.parentNode.removeChild(_oa);   // R16: приложение показалось → связь есть, окно выбора офлайна больше не нужно
  document.body.classList.add('pdshown');            // рамка проявляется
  var l=document.getElementById('ld'); if(!l) return;
  l.classList.add('gone');
  setTimeout(function(){ try{ l.style.display='none'; }catch(e){} }, 360);   // после перехода — из потока
}
function makeFrame(screen, qs){
  var f=document.createElement('iframe'); f.className='pdapp'; f.style.display='none';
  f.setAttribute('allow','web-share; clipboard-write; clipboard-read');
  var rec={ frame:f, appWin:null, ready:false, pending:null }; SCREENS[screen]=rec;
  // load = «HTML доехал», а НЕ «экран готов»: журнал в этот момент ещё тянет данные. Ждём pdpainted
  // от приложения, а load оставляем только страховкой на случай, если сигнала не будет (старый экран,
  // ошибка загрузки, отключённый JS) — иначе заставка залипла бы навсегда.
  f.addEventListener('load', function(){ setTimeout(hideSplash, 2600); });
  f.src=bootUrl(screen, qs); stage.appendChild(f); return rec;
}
function showFrame(screen){ Object.keys(SCREENS).forEach(function(k){ var r=SCREENS[k]; if(r) r.frame.style.display=(k===screen?'block':'none'); }); }
/* MULTI: несколько ОТКРЫТЫХ экранов (смета / её документ / журнал) — вкладки + ‹ › + ✕ закрыть.
   Экраны уже тёплые → переключение мгновенное и СОХРАНЯЕТ состояние (switchTo не шлёт pdgo).
   Свайп пальцем поверх iframe поймать нельзя (cross-origin: события внутрь не всплывают) → листаем стрелками/вкладками.
   Панель появляется ТОЛЬКО при 2+ открытых экранах — при одном поведение как раньше. */
var OPEN=[], CUR='';
var LBL={ journal:'Журнал', estimate:'Смета', assemble:'Документ', checklist:'Чек-лист' };   // D185
function renderBar(){
  document.body.classList.toggle('multi', OPEN.length>1);
  var t=document.getElementById('tabs'); if(!t) return;
  t.innerHTML=OPEN.map(function(s){
    return '<span class="pdtab'+(s===CUR?' on':'')+'" data-s="'+s+'">'+(LBL[s]||s)+(s==='journal'?'':'<i data-x="'+s+'" title="Закрыть">✕</i>')+'</span>';
  }).join('');
  var i=OPEN.indexOf(CUR), pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(pv) pv.className='pdnav'+(i<=0?' off':'');
  if(nx) nx.className='pdnav'+(i<0||i>=OPEN.length-1?' off':'');
}
function openAdd(s){ if(OPEN.indexOf(s)<0) OPEN.push(s); CUR=s; renderBar(); }
function switchTo(s){ if(OPEN.indexOf(s)<0) return; CUR=s; showFrame(s); renderBar(); }
function pageBy(d){ var i=OPEN.indexOf(CUR); if(i<0) return; var j=i+d; if(j<0||j>=OPEN.length) return; switchTo(OPEN[j]); }
function closeScreen(s){
  if(s==='journal') return;                                  // журнал — база, не закрываем
  var i=OPEN.indexOf(s); if(i<0) return;
  OPEN.splice(i,1);
  var r=SCREENS[s]; if(r) r.frame.style.display='none';       // iframe остаётся тёплым → повторное открытие мгновенно
  if(CUR===s){ CUR=OPEN[Math.max(0,i-1)]||'journal'; showFrame(CUR); }
  renderBar();
}
document.getElementById('bar').addEventListener('click', function(ev){
  var x=ev.target.closest && ev.target.closest('[data-x]'); if(x){ ev.stopPropagation(); closeScreen(x.getAttribute('data-x')); return; }
  var t=ev.target.closest && ev.target.closest('[data-s]'); if(t){ switchTo(t.getAttribute('data-s')); return; }
});
document.getElementById('prev').addEventListener('click', function(){ pageBy(-1); });
document.getElementById('next').addEventListener('click', function(){ pageBy(1); });
function sendGo(rec, qs){ if(rec.ready && rec.appWin){ rec.appWin.postMessage({pdgo:qs},'*'); } else { rec.pending=qs; } }
var HIST=[];   // стек показанных qs — «Назад» = вернуться на предыдущий (истинная история переходов)
function pushHist(qs){ qs=qs||''; if(HIST[HIST.length-1]!==qs) HIST.push(qs); if(HIST.length>40) HIST.shift(); }
function route(qs, isBack){
  var screen=screenOf(qs); var rec=SCREENS[screen];
  if(!rec){ makeFrame(screen, qs); showFrame(screen); }                        // холодный старт сразу на нужном qs
  else if(WARM[screen]){ showFrame(screen); sendGo(rec, qs); }                 // тёплый — навигация внутрь без релоада
  else { rec.frame.src=bootUrl(screen, qs); rec.ready=false; rec.appWin=null; showFrame(screen); }   // не-тёплый
  openAdd(screen);                                                            // MULTI: экран открыт → появляется во вкладках
  if(!isBack) pushHist(qs);
}
function goBack(){ if(HIST.length>1){ HIST.pop(); route(HIST[HIST.length-1], true); } else { route('', true); } }   // некуда → журнал
/* ═══ ОФЛАЙН-БУФЕР → ЖУРНАЛ (аддитивно) ═══
   offline.html (тот же origin) копит черновики-стикеры в localStorage['pd_offline_drafts'] (synced!==true =
   ещё не залито). Когда мы ОНЛАЙН и журнал готов (pdready), шлём их ему {pdFlush:[...]}; журнал создаёт
   стикеры через google.script.run→pushDrafts (без CORS) и отвечает {pdFlushDone:r}. По ответу помечаем
   залитое synced (сопоставляем по clientId). Весь блок ИНЕРТЕН, пока буфер пуст. */
var OD_DRAFT_KEY = 'pd_offline_drafts', _pdFlushSent = false;
function pdLoadDrafts(){ try{ var a=JSON.parse(localStorage.getItem(OD_DRAFT_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function pdUnsynced(list){ return (list||[]).filter(function(c){ return c && c.synced!==true; }); }
/* форма под pushDrafts_: type:'sticker' + clientId(=локальный id черновика) + поля стикера/пунктов */
function pdDraftPayload(c){
  return { type:'sticker', clientId:String((c&&c.id)||''), title:(c&&c.title)||'', descr:(c&&c.descr)||'',
    kind:(c&&c.kind)||'', color:(c&&c.color)||'', urgent:!!(c&&c.urgent), important:!!(c&&c.important),
    note:!!(c&&c.note), section:(c&&c.section)||'work', due:(c&&c.due)||'', repeat:(c&&c.repeat)||'',
    items:((c&&c.items)||[]).map(function(it){ return { task:(it&&it.task)||'', pct:+((it&&it.pct)||0),
      exec:(it&&it.exec)||'', due:(it&&it.due)||'', d1:(it&&it.d1)||'', d2:(it&&it.d2)||'', note:(it&&it.note)||'' }; }) };
}
function pdFlushDrafts(appWin, org){
  if(_pdFlushSent || !appWin) return;                        // одна попытка за загрузку
  var unsynced=pdUnsynced(pdLoadDrafts()); if(!unsynced.length) return;   // пусто → онлайн-путь не меняется
  _pdFlushSent=true;
  try{ appWin.postMessage({ pdFlush: unsynced.map(pdDraftPayload) }, org||'*'); }catch(e){}
}
function pdMarkSynced(created){
  if(!Array.isArray(created) || !created.length) return 0;
  var ids={}; created.forEach(function(x){ if(x && x.clientId) ids[String(x.clientId)]=1; });
  var list=pdLoadDrafts(), n=0;
  list.forEach(function(c){ if(c && ids[String((c.id)||'')] && c.synced!==true){ c.synced=true; n++; } });
  try{ localStorage.setItem(OD_DRAFT_KEY, JSON.stringify(list)); }catch(e){}
  return n;
}
function pdOfflineToast(t){
  var e=document.getElementById('pdOffToast');
  if(!e){ e=document.createElement('div'); e.id='pdOffToast';
    e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);z-index:99999;'+
      'background:#1B2A4E;color:#fff;font:600 13px system-ui,-apple-system,sans-serif;padding:10px 16px;border-radius:20px;'+
      'opacity:0;pointer-events:none;transition:opacity .2s,transform .2s';
    document.body.appendChild(e); }
  e.textContent=t; e.style.opacity='1'; e.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(e._t); e._t=setTimeout(function(){ e.style.opacity='0'; e.style.transform='translateX(-50%) translateY(10px)'; }, 2400);
}
/* ответ журнала на заливку — отдельный слушатель (основной обработчик не трогаем). Инертен, пока не
   пришёл pdFlushDone (а он приходит только если мы сами послали pdFlush из непустого буфера). */
window.addEventListener('message', function(ev){
  var d=ev.data; if(!d || !d.pdFlushDone) return;
  if(!pdOriginOk(ev.origin)) return;                         // доверяем только google-домену (как pdpainted)
  var r=d.pdFlushDone, n=pdMarkSynced(r && r.created);
  if(n) pdOfflineToast('Залито '+n);
});
/* D139: печать без баннера — грузим /exec autoprint в отдельный iframe (в iframe баннера нет), приложение
   сигналит pdprintready → печатаем сверху (github.io). Тёплые экраны прячем, чтобы печаталась только форма. */
var _pf=null, _pfTimer=null;
function cleanupPrint(){ if(_pfTimer){ clearTimeout(_pfTimer); _pfTimer=null; } if(_pf){ try{ _pf.remove(); }catch(e){} _pf=null; } var s=document.getElementById('stage'); if(s) s.style.display=''; document.body.classList.remove('printing'); }   // MULTI: вернуть панель после печати
// 1.5с не хватало на телефоне: диалог печати ещё не снял страницу, а рамку уже убирали → пустой лист.
function doPrint(){ if(!_pf) return; if(_pfTimer){ clearTimeout(_pfTimer); _pfTimer=null; } try{ window.print(); }catch(e){} setTimeout(cleanupPrint, 6000); }
function startPrint(qs){
  cleanupPrint();
  document.body.classList.add('printing');                                    // MULTI: панель вкладок не должна попасть в печать
  var s=document.getElementById('stage'); if(s) s.style.display='none';
  var f=document.createElement('iframe'); f.id='printframe'; f.setAttribute('allow','web-share');
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:9999';
  f.src=EXEC+withTok(qs); document.body.appendChild(f); _pf=f;   // D179: пропуск нужен и печатной рамке
  _pfTimer=setTimeout(doPrint, 4000);   // фолбэк, если pdprintready не пришёл
}
/* ⚠ НЕ убирать печатную рамку по раннему afterprint: на Android он прилетает ДО того, как диалог снял
   страницу → рамка исчезает и на предпросмотре ПУСТОЙ ЛИСТ (живой случай 17.07). Держим паузу. */
window.addEventListener('afterprint', function(){ setTimeout(cleanupPrint, 6000); });

/* D184: ПЕЧАТЬ БЛАНКА ЗДЕСЬ (не в iframe). Приложение присылает готовый HTML бланка + свои стили,
   мы кладём их в ЭТОТ документ и печатаем. Почему так: приложение живёт в cross-origin GAS-iframe,
   а телефон при печати снимает с такого iframe ЭКРАННУЮ картинку, не включая @media print → на бумагу
   уходил редактор со чекбоксами, а бланк (он скрыт до печати) не попадал вообще. Здесь, наверху,
   работают и @page A4, и @media print — на любом устройстве, и «экран = бумага».
   Стили приложения вставляем ПЕРВЫМИ в head: наш статичный <style> идёт после и перебивает их. */
var _paperCss=null;
/* Окно-отправитель обязано быть окном ОДНОГО ИЗ НАШИХ экранов (запоминаем их на pdready, см. ниже)
   либо печатной рамки. Это строже origin: домен googleusercontent.com общий для всех Apps Script мира. */
function isOurAppWin(src){
  if(!src) return false;
  var ok=false;
  Object.keys(SCREENS).forEach(function(k){ var r=SCREENS[k]; if(r && r.appWin && r.appWin===src) ok=true; });
  if(!ok && _pf){ try{ if(_pf.contentWindow===src) ok=true; }catch(e){} }
  return ok;
}
/* D195 БЕЗОПАСНОСТЬ: окно-отправитель pdready становится якорем доверия для isOurAppWin (гейт печати и
   шэра, где html идёт в innerHTML в origin обёртки — тут же лежит пропуск замка). Раньше регистрация шла
   БЕЗ проверок: любое окно с handle обёртки могло объявить себя нашим экраном и пройти isOurAppWin. */
function pdOriginOk(org){
  org=String(org||'');
  if(org.indexOf('https://')!==0) return false;
  var host=org.slice(8);
  if(host.indexOf('/')>=0 || host.indexOf(':')>=0) return false;
  if(host==='google.com' || host==='googleusercontent.com') return true;
  return host.slice(-11)==='.google.com' || host.slice(-22)==='.googleusercontent.com';
}
function pdIsDescendantOf(src, frame){   // окно src обязано жить ВНУТРИ нашей рамки (GAS вкладывает app на слой глубже)
  try{
    var target=frame && frame.contentWindow; if(!src || !target) return false;
    var w=src, n=0;
    while(w && n++<6){ if(w===target) return true; if(w===w.parent) break; w=w.parent; }   // .parent доступен кросс-origin
  }catch(e){}
  return false;
}
function cleanupPaper(){
  document.body.classList.remove('papering');
  document.documentElement.classList.remove('papering');
  var p=document.getElementById('pdpaper'); if(p) p.innerHTML='';
  if(_paperCss){ try{ _paperCss.remove(); }catch(e){} _paperCss=null; }
}
function printPaper(o){
  if(!o || typeof o.html!=='string' || !o.html) return false;   // нечего печатать → и ack не даём, чтобы сработал прежний путь
  cleanupPrint(); cleanupPaper();
  if(typeof o.css==='string' && o.css){
    var s=document.createElement('style'); s.id='pdpapercss'; s.textContent=o.css;
    document.head.insertBefore(s, document.head.firstChild); _paperCss=s;
  }
  var p=document.getElementById('pdpaper'); p.innerHTML=o.html;
  document.body.classList.add('papering');
  document.documentElement.classList.add('papering');
  try{ window.scrollTo(0,0); }catch(e){}
  setTimeout(function(){ try{ window.print(); }catch(e){} armPaperCleanup(); }, 400);   // 400мс — дать шрифтам/раскладке осесть
  /* ⚠ ОБЯЗАТЕЛЬНО true: вызывающий делает `if(!printPaper(o)) return;` — без этого ack не уходит,
     приложение через 1.6с решает «обёртка не ответила», откатывается на старый путь, а тот СТИРАЕТ
     уже вставленный бланк и печатает недогруженную рамку → ЧИСТЫЙ ЛИСТ (живой случай 17.07). */
  return true;
}
/* ⚠ Уборка бумаги — ТОЛЬКО НЕ РАНЬШЕ, чем система реально сняла страницу.
   Грабли (17.07, живой случай — «печатается чистая страница»): на Android `window.print()` открывает
   системный диалог АСИНХРОННО, а событие `afterprint` прилетает практически сразу — ДО того, как диалог
   снял содержимое. Уборка по afterprint стирала бланк у диалога из-под носа → на предпросмотре пустой лист.
   Раньше тут стоял таймер 1.5с — он «случайно» работал именно потому, что не слушал afterprint.
   Теперь: держим бумагу минимум HOLD мс, и только потом реагируем на сигналы возврата. */
var PAPER_HOLD_MS = 6000;   // столько бумага гарантированно живёт после вызова печати
function armPaperCleanup(){
  var done=false, armed=false;
  function fin(){ if(done) return; done=true;
    window.removeEventListener('afterprint', fin); window.removeEventListener('focus', fin);
    cleanupPaper();
  }
  setTimeout(function(){   // до этого момента НИКАКИЕ сигналы бумагу не убирают
    if(done) return;
    armed=true;
    window.addEventListener('afterprint', fin);
    window.addEventListener('focus', fin);
  }, PAPER_HOLD_MS);
  setTimeout(fin, 90000);   // последний рубеж: не залипнуть с бланком вместо экранов
}

/* D195: ПОДЕЛИТЬСЯ. Обёртка собирает из ГОТОВОГО бланка (тот же html+css, что уходит на печать) файл PDF
   и отдаёт его в navigator.share (почта/мессенджер/печать). Почему в обёртке, а не в приложении:
   navigator.share внутри вложенного GAS-iframe не делегируется (как navigator.vibrate — проверено), а
   верхний документ им владеет. Рендер — html2canvas→jsPDF картинкой (вектор криво рисует шрифты в мобильных
   PDF-viewer'ах — урок проекта; образец — gas-perechen makePdfBlob). Библиотеки — лениво с cdnjs при первом
   «Поделиться». Новый PDF владельцу собирать не надо: это ровно тот бланк, что он печатает. */
var _pdfLibs=null;
function ensurePdfLibs(){
  if(_pdfLibs) return _pdfLibs;
  _pdfLibs=new Promise(function(res,rej){
    var need=[];
    if(typeof html2canvas==='undefined') need.push('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) need.push('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    var i=0; (function nx(){ if(i>=need.length){ res(); return; } var s=document.createElement('script'); s.src=need[i++]; s.onload=nx; s.onerror=function(){ rej(new Error('pdflibs')); }; document.head.appendChild(s); })();
  });
  return _pdfLibs;
}
function pdSanitizeName(s){ s=String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e]/g,'').replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,80); return s || 'PRIME DOCS'; }
function pdDownloadBlob(blob, name){ try{ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(u); }catch(e){} }, 5000); }catch(e){} }
/* D301: ПОСТРАНИЧНАЯ СБОРКА PDF (замена «одна длинная картинка, режем по высоте листа»).
   Что было не так: весь бланк рисовался ОДНИМ снимком и нарезался вслепую — страница рвалась
   посреди строки таблицы, а следующий документ начинался в середине листа (жалоба владельца).
   Плюс скрытая беда: реестр с приложениями давал холст в десятки тысяч пикселей — на телефоне
   это у края возможностей браузера.
   Как теперь: 1) каждый БЛАНК (.rsheet — реестр, .sheet — документ) рисуется отдельно и всегда
   начинается с новой страницы; 2) внутри бланка разрез идёт по «швам» — низ строки таблицы или
   карточки, а не по линейке; 3) сверху каждой страницы — строка «реестр, дата · page N / M». */
var PDF_SCALE=2.5, PDF_HDR_MM=9, PDF_BOT_MM=6;
function pdBlocksOf(root){                       // бланки верхнего уровня; нет таких — весь корень одним куском
  var all=[].slice.call(root.querySelectorAll('.rsheet,.sheet'));
  var top=all.filter(function(el){ return !all.some(function(p){ return p!==el && p.contains(el); }); });
  return top.length?top:[root];
}
function pdCutsOf(block){                        // допустимые линии разреза = низ строки/карточки/прямого потомка
  var bt=block.getBoundingClientRect().top, pts=[];
  function add(el){ try{ var y=el.getBoundingClientRect().bottom-bt; if(y>4) pts.push(y); }catch(e){} }
  [].forEach.call(block.children, add);
  [].forEach.call(block.querySelectorAll('tr,.mrg-card,.apx-label,.sch-row,.payband,.mrg-note,.crypto-note'), add);
  pts.sort(function(a,b){ return a-b; });
  return pts;
}
function pdSlices(cuts, totalH, pageH){          // → [{y0,y1}] в CSS-пикселях
  var out=[], y=0, guard=0;
  while(y<totalH-1 && guard++<300){
    var want=y+pageH, y1=0;
    if(want>=totalH-0.5) y1=totalH;
    else {
      for(var i=0;i<cuts.length;i++){ if(cuts[i]<=want && cuts[i]>y+pageH*0.25) y1=cuts[i]; }
      if(!y1) y1=want;                           // один элемент выше страницы — резать по-хорошему негде
    }
    out.push({y0:y,y1:y1}); y=y1;
  }
  return out;
}
function pdRenderPdfBlob(html, css, opts){   // офскрин-рендер бланка в PDF (образец — gas-perechen)
  opts=opts||{};
  return new Promise(function(resolve,reject){
    var st=null; if(css){ st=document.createElement('style'); st.textContent=css; document.head.appendChild(st); }
    var wrap=document.createElement('div'); wrap.style.cssText='position:fixed;left:-99999px;top:0;background:#fff;width:210mm';
    wrap.innerHTML=html; document.body.appendChild(wrap);
    function done(){ try{ document.body.removeChild(wrap); }catch(e){} if(st){ try{ st.remove(); }catch(e){} } }
    var root=wrap.firstElementChild||wrap, blocks=pdBlocksOf(root);
    var jsPDF=window.jspdf.jsPDF, pdf=new jsPDF('p','mm','a4');
    var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    var hdr=opts.header?PDF_HDR_MM:0, pages=[], bi=0;
    function finish(){
      if(!pages.length){ reject(new Error('empty')); return; }
      pages.forEach(function(p,n){
        if(n) pdf.addPage();
        if(hdr){
          try{
            pdf.setFontSize(8); pdf.setTextColor(120);
            pdf.text(String(opts.header).slice(0,90), 8, 6.4);
            pdf.text('page '+(n+1)+' / '+pages.length, pw-8, 6.4, {align:'right'});
            pdf.setDrawColor(205); pdf.line(8, 7.8, pw-8, 7.8);
            pdf.setTextColor(0);
          }catch(e){}
        }
        pdf.addImage(p.img,'JPEG',0,hdr,pw,p.hmm,undefined,'FAST');
      });
      resolve({blob:pdf.output('blob'), pages:pages.length});
    }
    (function nextBlock(){
      if(bi>=blocks.length){ done(); finish(); return; }
      var b=blocks[bi++], W=b.offsetWidth||root.offsetWidth||794, cuts=pdCutsOf(b);
      html2canvas(b,{scale:PDF_SCALE,useCORS:true,backgroundColor:'#ffffff',windowWidth:W,width:W,scrollX:0,scrollY:0})
        .then(function(canvas){
          var mmPerPx=pw/W, totalH=canvas.height/PDF_SCALE, pageH=(ph-hdr-PDF_BOT_MM)/mmPerPx;
          pdSlices(cuts, totalH, pageH).forEach(function(s){
            var h=Math.max(1,Math.round((s.y1-s.y0)*PDF_SCALE));
            var c2=document.createElement('canvas'); c2.width=canvas.width; c2.height=h;
            var cx=c2.getContext('2d'); cx.fillStyle='#ffffff'; cx.fillRect(0,0,c2.width,h);
            cx.drawImage(canvas,0,Math.round(s.y0*PDF_SCALE),canvas.width,h,0,0,canvas.width,h);
            pages.push({img:c2.toDataURL('image/jpeg',0.94), hmm:(s.y1-s.y0)*mmPerPx});
            c2.width=1; c2.height=1;             // холст среза больше не нужен — освобождаем память телефона
          });
          canvas.width=1; canvas.height=1;
          nextBlock();
        }).catch(function(e){ done(); reject(e); });
    })();
  });
}
/* D301: onData — файл отдаётся приложению СРАЗУ после сборки, ДО «Поделиться» (приложение кладёт его
   на Диск). Почему до: пока открыт системный лист «Поделиться», страница может быть заморожена, а если
   владелец уйдёт в другое приложение и не вернётся — сохранение на Диск не состоялось бы вовсе. */
function sharePaper(o, onData){
  return new Promise(function(resolve){
    if(!o || typeof o.html!=='string' || !o.html){ resolve({ok:false,msg:'нечего отправить'}); return; }
    var name=pdSanitizeName(o.filename)+'.pdf', title=String(o.title||o.filename||'PRIME DOCS').slice(0,120);
    ensurePdfLibs().then(function(){ return pdRenderPdfBlob(o.html, typeof o.css==='string'?o.css:'', {header:o.header||''}); }).then(function(res){
      var blob=res.blob, file=new File([blob], name, {type:'application/pdf'});
      function share(){
        /* D303: «Сохранить без отправки». Гард ВНУТРИ share() → покрывает ВСЕ три вызова (ранний,
           fr.onload, fr.onerror): при noShare никакой navigator.share не открывается. Файл на Диск уже
           ушёл отдельным сообщением (onData→pdsharedata), поэтому «Сохранить» и «Отправить» отличаются
           ровно этим флагом. */
        if(o.noShare){ resolve({ok:true,noShare:true}); return; }
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:title}).then(function(){ resolve({ok:true,msg:''}); })
            .catch(function(err){ if(err && err.name==='AbortError'){ resolve({ok:true,msg:''}); } else { pdDownloadBlob(blob,name); resolve({ok:true,msg:'«Поделиться» не вышло — PDF скачан'}); } });
        } else { pdDownloadBlob(blob,name); resolve({ok:true,msg:'PDF скачан — приложи вручную'}); }
      }
      if(!(o.wantData && typeof onData==='function')){ share(); return; }
      var fr=new FileReader();
      fr.onload=function(){ try{ onData({ base64:String(fr.result||'').split(',')[1]||'', name:name, pages:res.pages }); }catch(e){} share(); };
      fr.onerror=function(){ share(); };        // не прочиталось → просто без копии на Диске, «Поделиться» не срываем
      fr.readAsDataURL(blob);
    }).catch(function(e){ resolve({ok:false,msg:'не удалось собрать PDF'}); });
  });
}

window.addEventListener('message', function(ev){
  var d=ev.data; if(!d) return;
  if(d.pdprintdoc){                                                              // D184: печать бланка верхним документом
    /* ⚠ ПРОВЕРЯЕМ ОКНО, А НЕ ДОМЕН (находка ревью, до прода). Маска `*.googleusercontent.com` НЕ годится:
       на этом домене Google исполняет пользовательский код ЛЮБОГО Apps Script — то есть проверку проходил
       чужой скрипт. А тут html идёт в innerHTML, и `<img onerror>` выполнился бы в origin ОБЁРТКИ, где
       лежит пропуск (localStorage) → кража пропуска и обход замка. Доверяем только окнам СВОИХ экранов
       (их запоминаем на pdready) — чужое окно им не является. */
    if(!isOurAppWin(ev.source)) return;
    if(!printPaper(d.pdprintdoc)) return;                                        // ack — только если бумага реально собрана
    try{ ev.source.postMessage({pdprintok:true}, ev.origin || '*'); }catch(e){}  // ack: приложение не уйдёт в старый путь
    return;
  }
  if(d.pdsharedoc){                                                             // D195: поделиться готовым бланком как PDF (та же защита окна, что у печати)
    if(!isOurAppWin(ev.source)) return;
    var _sSrc=ev.source, _sOrg=ev.origin;
    sharePaper(d.pdsharedoc, function(dat){ try{ _sSrc.postMessage({ pdsharedata:dat }, _sOrg||'*'); }catch(e){} })   // D301: сам файл — отдельным сообщением, сразу после сборки
      .then(function(r){ try{ _sSrc.postMessage({ pdshareok:!!(r&&r.ok), msg:(r&&r.msg)||'' }, _sOrg||'*'); }catch(e){} });
    return;
  }
  if(typeof d.pdopenurl==='string'){                                            // D303: открыть сохранённый PDF реестра с Диска в НОВОЙ вкладке (top-level; из GAS-iframe window.open ненадёжен)
    if(!isOurAppWin(ev.source)) return;                                         // только окна наших экранов (журнал/бланк) — как у печати/шаринга
    var u=d.pdopenurl;
    if(/^https:\/\/([a-z0-9-]+\.)*(google\.com|googleusercontent\.com)\//.test(u)){ try{ window.open(u,'_blank','noopener'); }catch(e){} }   // только Google-ссылки (наши файлы на Диске)
    return;
  }
  if(typeof d.pdtoken==='string'){                                              // D179: код принят — запоминаем пропуск и пересобираем рамки уже с ним
    /* Отправителя проверяем: приложение живёт на google — чужая страница не должна подсовывать пропуск
       (находка ревью: обработчик принимал сообщение от кого угодно). Подделка пропуска сервером всё равно
       отбивается, но чужое сообщение могло бы затереть рабочий пропуск и выбить владельца. */
    var org = String(ev.origin||'');
    if(!/^https:\/\/([a-z0-9-]+\.)*(google\.com|googleusercontent\.com)$/.test(org)) return;
    PD_TOKEN=d.pdtoken; try{ localStorage.setItem('pd_token', PD_TOKEN); }catch(e){}
    try{ location.reload(); }catch(e){}
    return;
  }
  if(typeof d.pdprint==='string'){ startPrint(d.pdprint); return; }              // D139: печать через обёртку
  if(d.pdprintready){ doPrint(); return; }
  if(d.pdback){ goBack(); return; }                                            // «Назад» из экрана → предыдущий по стеку
  if(typeof d.pdnav==='string' && /^(\?[\w=&%.\-]*)?$/.test(d.pdnav)){ route(d.pdnav); return; }
  if(d.pdpainted){ if(pdOriginOk(ev.origin)) hideSplash(); return; }            // экран ОТРИСОВАЛ данные → плавно снимаем заставку
  if(d.pdready && d.screen && SCREENS[d.screen]){
    if(!pdOriginOk(ev.origin)) return;                                          // D195: только google-домен…
    var rec=SCREENS[d.screen];
    if(!pdIsDescendantOf(ev.source, rec.frame)) return;                         // …и окно реально живёт в НАШЕЙ рамке (решающая проверка)
    if(rec.appWin && rec.appWin!==ev.source) return;                            // не переписывать уже зарегистрированное окно экрана
    rec.appWin=ev.source; rec.ready=true;                                       // окно app (не contentWindow)
    try{ ev.source.postMessage({ pdcaps:{ ver:3, share:!!(navigator.share && navigator.canShare), print:true, pdf:true, noshare:true, openurl:true } }, ev.origin||'*'); }catch(e){}   // D195/D301 · D303 (ver:3): умеем «Сохранить без отправки» (noshare) и «открыть файл с Диска» (openurl)
    if(rec.pending){ ev.source.postMessage({pdgo:rec.pending},'*'); rec.pending=null; }
    if(d.screen==='journal') pdFlushDrafts(ev.source, ev.origin);   // ← ЕДИНСТВЕННАЯ добавка к онлайн-пути: залить офлайн-буфер (инертна, если буфер пуст)
  }
});
/* R16 зам.: офлайн ОТКЛЮЧЁН — SW снимаем (kill-switch sw.js очистит кэш и разрегистрируется). */
